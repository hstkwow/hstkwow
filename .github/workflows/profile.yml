name: Refresh profile artwork
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_profile.py
      - .github/workflows/profile.yml
permissions:
  contents: write
concurrency:
  group: profile-artwork
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate artwork from GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile.py
      - name: Commit updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then
            echo 'Artwork is already up to date.'
          else
            git commit -m 'Update profile activity artwork'
            git push
          fi
